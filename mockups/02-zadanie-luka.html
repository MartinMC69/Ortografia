<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zadanie — uzupełnij lukę</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
body{margin:0}
a{color:#2A52D6}a:hover{color:#1B2440}
.kratka{background-color:#FFFFFF;background-image:linear-gradient(#DCE5F7 1px,transparent 1px),linear-gradient(90deg,#DCE5F7 1px,transparent 1px);background-size:28px 28px}
</style>
</head>
<body>
<div style="min-height: 900px; box-sizing: border-box; background: #F1F5FC; color: #1B2440; font-family: 'Nunito', sans-serif; font-size: 1rem; line-height: 1.5">
<header style="background: #FFFFFF; border-bottom: 2px solid #D9E1F2">
<div style="max-width: 960px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 14px 24px">
<button type="button" aria-label="Zakończ rundę" style="width: 48px; height: 48px; border: 2px solid #D9E1F2; border-radius: 14px; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1B2440" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
<div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 6px">
<div style="font-weight: 800">Zadanie 4 z 10</div>
<div role="progressbar" aria-valuemin="0" aria-valuemax="10" aria-valuenow="3" aria-label="Postęp rundy" style="height: 14px; border-radius: 999px; background: #E3EAFB"><div style="width: 30%; height: 14px; border-radius: 999px; background: #2A52D6"></div></div>
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #E3EAFB; font-weight: 800">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2440" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2M9 2h6"></path></svg>
0:22
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: #FFE2BD; font-weight: 800">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2440" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2 15.1 8.3 22 9.3 17 14.1 18.2 21 12 17.8 5.8 21 7 14.1 2 9.3 8.9 8.3 12 2"></polygon></svg>
45 pkt
</div>
<div aria-label="Zostały 2 życia z 3" style="display: flex; gap: 4px">
<svg width="26" height="26" viewBox="0 0 24 24" fill="#C7361F" stroke="#C7361F" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.700-8 11-8 11z"></path></svg>
<svg width="26" height="26" viewBox="0 0 24 24" fill="#C7361F" stroke="#C7361F" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.700-8 11-8 11z"></path></svg>
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#7C869E" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-8-5.3-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.700-8 11-8 11z"></path></svg>
</div>
</div>
</header>

<main style="max-width: 960px; margin: 0 auto; padding: 32px 24px 56px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<span style="padding: 6px 14px; border-radius: 999px; background: #1B2440; color: #FFFFFF; font-weight: 800">Ó czy U</span>
<span style="font-weight: 700; color: #4A5573">Poziom: Średni · 15 pkt za poprawną odpowiedź</span>
</div>

<section class="kratka" style="border: 2px solid #D9E1F2; border-left: 2px solid #D9E1F2; border-radius: 28px; padding: 44px 32px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">
<h1 style="margin: 0; font-size: 1.375rem; font-weight: 800">Wstaw brakującą literę</h1>
<div style="font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 5rem; line-height: 1.1; display: flex; align-items: flex-end; gap: 6px">
<span>mr</span>
<span aria-label="brakująca litera" style="display: inline-block; width: 68px; height: 84px; border-radius: 14px; border: 4px dashed #2A52D6; background: #E3EAFB"></span>
<span>z</span>
</div>
<p style="margin: 0; font-size: 1.25rem; max-width: 32rem">Rano na szybach pojawił się <strong>mr_z</strong> i wszystkie kałuże zamarzły.</p>
</section>

<div role="group" aria-label="Wybierz literę" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px">
<button type="button" style="min-height: 104px; border: 3px solid #1B2440; border-radius: 22px; background: #FFFFFF; color: #1B2440; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 3.5rem; cursor: pointer; box-shadow: 0 6px 0 #1B2440">ó</button>
<button type="button" style="min-height: 104px; border: 3px solid #1B2440; border-radius: 22px; background: #FFFFFF; color: #1B2440; font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 3.5rem; cursor: pointer; box-shadow: 0 6px 0 #1B2440">u</button>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<button type="button" style="min-height: 48px; padding: 0 20px; border: 2px solid #D9E1F2; border-radius: 14px; background: #FFFFFF; color: #1B2440; font-family: inherit; font-weight: 800; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 10px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1B2440" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.500c.7.700 1 1.500 1 2.500h6c0-1 .3-1.800 1-2.500A6 6 0 0 0 12 3z"></path></svg>
Podpowiedź (−5 pkt)
</button>
<div style="font-weight: 700; color: #4A5573">Seria: 3 poprawne z rzędu · następna da premię +5 pkt</div>
</div>
</main>
</div>
</body>
</html>
